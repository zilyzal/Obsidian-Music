name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the APK to (e.g. 1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        shell: bash
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler and Gradle errors as annotations so they show on the run page.
            { grep -E "^e: " build.log; grep -A8 "What went wrong" build.log; } | head -60 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          fi
          exit $status

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianMusic-release
          path: app/build/outputs/apk/release/*.apk

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ObsidianMusic.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/ObsidianMusic.apk
